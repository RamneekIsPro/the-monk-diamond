<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <style>
        .menu {
            max-width: 100%;
            padding: 10px;
            background-color: red;
            gap: 20px;
        }
        .heading {
            background-color: lightblue;
            padding: 10px;
            margin: 5px;
            gap: 20px;
        }
        .images {
            background-color: blueviolet;
            width: 100%;
            border: 4px solid black;
            gap: 250px;
        }
        .mainBody {
            background-color: lightgreen;
            padding: 10px;
            margin: 5px;
        }
        input[type="button"] {
            background-color: pink;
            cursor: pointer;
        }
        input[type="button"]:hover {
            background-color: purple;
        }
        body {
            background-color: #111;
        }
        .footer {
            max-width: 100%;
            border: 4px solid black;
            margin: 1px;
            background-color: violet;
            padding: 10px
        }
        .flex {
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
    <script>
        function addItem() {
            var newItem = document.createElement("div");
            newItem.innerHTML = document.getElementById("input").value;
            newItem.onclick = removeItem;
            document.getElementById("itemList").appendChild(newItem);
            saveList();
        }
        function removeItem() {
            document.getElementById("itemList").removeChild(this);
            saveList();
        }
        function saveList() {
            localStorage.tasks = document.getElementById("itemList").innerHTML;
        }
        function loadList() {
            document.getElementById("itemList").innerHTML = localStorage.tasks;
            for (var i = 0; i < itemList.children.length; i++) {
                itemList.children[i].onclick = removeItem;
            }
        }
    </script>
</head>
<body>
    <div class="heading flex">
        <img src="VolkovLogo.jpg" alt="Volkov Logo" width="150px" height="109.5px">
        <h1>The House of Volkov</h1>
    </div>
    <div class="menu flex">
        <a href="monkdiamonddiscovery.html">The Monk Diamond Discovery</a>/
        <a href="route.html">The Route</a>/
        <a href="index.html">Home</a>/
        <a href="diamond.html">The Diamond</a>/
        <a href="discovery.html">The Discovery</a>/
        <a href="exhibition.html">The Exhibition</a>/
        <a href="volkov.html">The House of Volkov</a>
    </div>
    <div class="images flex">
        <img src="MrVolkov.jpg" alt="Mr. Volkov">
        <img src="ToDoList.jpg" alt="To-Do List">
    </div>
    <div class="mainBody">
        <p>Special Exhibition To-Do List</p>
        <input type="text" placeholder="Type here to add task" id="input"><br><br>
        <input type="button" value="Add Item" onclick="addItem()">
        <div id="itemList"></div>
    </div>
    <div class="footer flex">Contact Professor Bairstone: profbairstone@intrepidexplorer.com</div>
    <script>
        if (localStorage.tasks) {
            loadList();
        }
    </script>
</body>
</html>
